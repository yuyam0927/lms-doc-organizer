[project]
name = "lms-doc-organizer"
version = "0.1.0"
description = "Convert docx, pdf, xlsx, txt, and md files into Markdown, and organize them with a local LLM's help."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
lms-doc2md = "lms_document_to_md_parser.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lms_document_to_md_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
